/* ------------------------- Dates ------------------------- */
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const addDays = (d,n)=>{const x=new Date(d); x.setDate(x.getDate()+n); return x;};
const THIS_MON = addDays(TODAY, -((TODAY.getDay()+6)%7));
const dateOf = (w,d)=>addDays(THIS_MON, 7*w+d);
const todayW = 0, todayD = (TODAY.getDay()+6)%7;
const isToday = (w,d)=>w===todayW&&d===todayD;
const isPast = (w,d)=> w<todayW || (w===todayW && d<todayD);
const fmtDay = (w,d)=>{const x=dateOf(w,d); return `${DAYS[d]}, ${MONTHS[x.getMonth()]} ${x.getDate()}`;};
const fmtNum = (w,d)=>dateOf(w,d).getDate();
const weekLabel = w=>{const a=dateOf(w,0), b=dateOf(w,6); return a.getMonth()===b.getMonth()?`${MONTHS[a.getMonth()]} ${a.getDate()} – ${b.getDate()}`:`${MONTHS[a.getMonth()]} ${a.getDate()} – ${MONTHS[b.getMonth()]} ${b.getDate()}`;};
const weekRel = w=>({'-1':'Last week','0':'This week','1':'Next week'})[w] || (w>1?`In ${w} weeks`:`${-w} weeks ago`);

/* ------------------------- Time helpers ------------------------- */
const toMin = t=>{const [h,m]=t.split(':').map(Number); return h*60+m;};
const fmtT = t=>{const m=toMin(t); let h=Math.floor(m/60), mm=m%60; const s=h<12?'a':'p'; h=h%12||12; return h+(mm?':'+String(mm).padStart(2,'0'):'')+s;};
const span = s=>`${fmtT(s.s)}–${fmtT(s.e)}`;
const hrs = s=>{let a=toMin(s.s), b=toMin(s.e); if(b<=a) b+=1440; return (b-a)/60;};
const overlaps = (a,b)=>a.w===b.w&&a.d===b.d&&toMin(a.s)<toMin(b.e)&&toMin(b.s)<toMin(a.e);
const fmtH = h=>(Math.round(h*10)/10)+'h';

/* ------------------------- Utilities ------------------------- */
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// random ids: safe when several people edit at once (letters and digits only — ids are joined with '-' in channel names)
const nid = p=>p+Array.from(crypto.getRandomValues(new Uint32Array(2)),n=>n.toString(36)).join('');
const avatar = (id,cls='')=>{ if(!id) return `<span class="avatar ${cls}" style="background:var(--t-amber);color:var(--amber-ink)">?</span>`; const p=PEOPLE[id]; const src=p.photo===''?null:(p.photo||AV[id]); if(src) return `<img class="avatar ${cls}" src="${src}" alt="${esc(p.name)}">`; const ini=p.name.split(' ').map(x=>x[0]).join(''); return `<span class="avatar ${cls}" style="background:var(--deep);color:var(--green)">${ini}</span>`; };
const nameOf = id=>id?(PEOPLE[id]?PEOPLE[id].name:'Former teammate'):'Open shift';
const firstOf = id=>id?(PEOPLE[id]?PEOPLE[id].first:'Former teammate'):'Anyone';
const icon = (n,s=16)=>`<svg width="${s}" height="${s}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const listNames = a=>a.length<2?(a[0]||''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
const nowStamp = ()=>{const d=new Date(); let h=d.getHours(), m=d.getMinutes(); return `Today ${h%12||12}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`;};
