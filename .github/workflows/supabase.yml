# Applies database changes and deploys the `api` Edge Function when app/supabase/ changes.
# This file must live at the TOP of the repo: .github/workflows/supabase.yml
# Repo › Settings › Secrets and variables › Actions:
#   Secrets:   SUPABASE_ACCESS_TOKEN  (supabase.com › Account › Access Tokens)
#              SUPABASE_DB_PASSWORD   (the database password you chose for the project)
#              SUPABASE_DB_URL        (Connect › Session pooler string, with the password filled in)
#   Variables: SUPABASE_PROJECT_REF   (the <project-ref> in https://<project-ref>.supabase.co)
name: Deploy Supabase
on:
  push:
    branches: [main]
    paths: ['app/supabase/**']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
      - run: supabase db push --db-url "$SUPABASE_DB_URL" --yes
      - run: supabase functions deploy api --no-verify-jwt --project-ref ${{ vars.SUPABASE_PROJECT_REF }} --yes
